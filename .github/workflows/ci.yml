name: ci

on:
  push:
  pull_request:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the toolchain
        run: cargo build --release --manifest-path compiler/Cargo.toml
      - name: Tests (unit, payload, conformance corpus)
        run: cargo test --release --manifest-path compiler/Cargo.toml
      - name: Weld and run standalone binaries
        run: |
          M=compiler/target/release/mlang
          for f in examples/pipeline.ml examples/mandelbrot.ml examples/std-tour.ml; do
            out="/tmp/$(basename "$f" .ml)"
            "$M" build "$f" -o "$out"
            "$out" > /dev/null
          done
          "$M" build examples/calc.ml -o /tmp/calc
          printf '3 4 +\n' | /tmp/calc | grep -qx 7
          echo "standalone binaries OK"
