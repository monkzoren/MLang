name: ci

on:
  push:
  pull_request:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the toolchain
        run: cargo build --release --manifest-path compiler/Cargo.toml
      - name: Tests (unit, payload, conformance corpus)
        run: cargo test --release --manifest-path compiler/Cargo.toml
      - name: Bench harness smoke (port goldens + robustness mini-sweep)
        run: |
          python3 bench/record_ports.py --check
          python3 bench/robustness.py --seeds-mlang 1 --seeds-python 2 --jobs 4
          git checkout -- bench/results/
      - name: Weld and run standalone binaries
        run: |
          M=compiler/target/release/mlang
          for f in examples/pipeline.ml examples/mandelbrot.ml examples/std-tour.ml; do
            out="/tmp/$(basename "$f" .ml)"
            "$M" build "$f" -o "$out"
            "$out" > /dev/null
          done
          "$M" build examples/rpn.ml -o /tmp/rpn
          printf '3 4 +\n' | /tmp/rpn | grep -qx 7
          "$M" build examples/construct.ml -o /tmp/console
          printf 'q\n' | /tmp/console | grep -q 'Nebuchadnezzar'
          "$M" build examples/jack-in.ml -o /tmp/jackin
          /tmp/jackin < /dev/null | grep -q 'Nebuchadnezzar'
          echo "standalone binaries OK"
