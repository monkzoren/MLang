name: ci

on:
  push:
  pull_request:

jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Conformance (reference engine)
        run: python conformance/run.py python -m mlang

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native engine
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Conformance (native engine)
        run: python conformance/run.py rust/target/release/mlang
