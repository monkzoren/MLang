# For Coolify's "Docker Compose" build pack. The Dockerfile on its own works
# just as well — see chat/README.md.
#
# Note there is no `ports:` mapping. Coolify puts its own proxy in front and
# terminates TLS there, so the container only needs to be reachable on the
# internal network; publishing 8080 on the host would bypass the proxy and
# serve the bot over plain HTTP on a bare port. Set the domain in Coolify
# instead and let it route to 8080.
services:
  grid-chat:
    build:
      context: ..
      dockerfile: chat/Dockerfile
    expose:
      - "8080"
    environment:
      # Reaches the grid as ⌂0@, the token POST /teach must carry. Without
      # it the bot serves and refuses to learn, which is the safe default.
      TEACH_TOKEN: ${TEACH_TOKEN}
      # ⌂2@, the key the learner strand asks the model with. Which provider
      # that is comes from E in chat.ml, not from here. Leave it unset and the
      # bot still answers everything it knows, says so plainly when it does
      # not, and never talks to anything outside this server.
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      # The bot's memory. Without this a redeploy resets it to the seed.
      - grid-data:/data
    restart: unless-stopped

volumes:
  grid-data:
