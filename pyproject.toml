[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlang"
version = "0.1.0"
description = "MLang — the Matrix language: vertical strands of single-glyph code, running in parallel"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["language", "interpreter", "concatenative", "concurrent", "matrix"]

[project.scripts]
mlang = "mlang.cli:main"

[tool.setuptools]
packages = ["mlang"]
